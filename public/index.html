<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#8b88b5" />
    <title>Home | Schulich on a Chip</title>
    <link rel="icon" href="/images/logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/site.js" defer></script>
  </head>
  <body data-page="home">
    <div class="sky" aria-hidden="true">
      <div class="sky-day"></div>
      <div class="sky-night"></div>
    </div>
    <div class="wafer" aria-hidden="true"></div>
    <header class="site-header">
      <nav class="primary-nav" aria-label="Quick Links">
        <div class="nav-side">
          <a href="/team">Team</a>

          <a href="/about">About Us</a>
        </div>
        <div class="nav-emblem">
          <a class="brand" href="/" aria-label="Schulich on a Chip">
            <img
              src="/images/logo.png"
              width="54"
              height="54"
              alt="Team logo"
            />
          </a>
          <a class="home-button" href="/" aria-label="Home" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7" />
            </svg>
          </a>
        </div>
        <div class="nav-side">
          <a href="/projects">Projects</a>

          <a href="/events">Events</a>
        </div>
      </nav>
    </header>
    <main id="content" tabindex="-1">
      <section class="home-hero">
        <h1>Schulich on a Chip</h1>
        <div class="home-links">
          <a class="button" href="/about">
            About Us
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14m-5-5 5 5-5 5" />
            </svg>
          </a>

          <a class="text-button" href="/projects">
            Projects
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14m-5-5 5 5-5 5" />
            </svg>
          </a>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="footer-brand" href="/">Schulich on a Chip</a>
      <div class="footer-links">
        <a class="" href="/recruitment">Recruitment</a>

        <div class="footer-contact">
          <a class="" href="mailto:executives@schulichonachip.ca">Contact Us</a>

          <a class="" href="mailto:executives@schulichonachip.ca">
            executives@schulichonachip.ca
          </a>
        </div>
      </div>
    </footer>
    <aside class="contact-dock" aria-label="Contact Us">
      <a
        href="https://www.linkedin.com/company/schulich-on-a-chip"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
      >
        <svg viewBox="0 0 24 24">
          <path d="M5 9v11M5 4v.01M10 20V9h4v2c3-4 6-2 6 2v7M14 20v-7" />
        </svg>
      </a>
      <a
        href="https://www.instagram.com/soc.ucalgary"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <path d="M17 7h.01" />
        </svg>
      </a>
      <a
        href="mailto:executives@schulichonachip.ca"
        aria-label="executives@schulichonachip.ca"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 6 9 7 9-7" />
        </svg>
      </a>
      <span class="dock-divider"></span>

      <a class="dock-support" href="/support">Support Us</a>
    </aside>
  </body>
</html>
